<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bg-void" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" />
      <stop offset="100%" stop-color="#030305" />
    </linearGradient>

    <radialGradient id="zenith-corona" cx="50%" cy="40%" r="52%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.11" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.035" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="eclipse-rim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="18%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.42" />
      <stop offset="82%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="eclipse-bloom" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.03" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="75%" stop-color="#ffffff" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="orbital-ring" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.06" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.16" />
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="lat-line-1" x1="10%" y1="0%" x2="90%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="lat-line-2" x1="15%" y1="0%" x2="85%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="ray-grad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.055" />
      <stop offset="65%" stop-color="#ffffff" stop-opacity="0.015" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="planet-crust" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#09090d" stop-opacity="0.96" />
      <stop offset="45%" stop-color="#020204" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#000000" stop-opacity="1" />
    </linearGradient>

    <clipPath id="banner-clip">
      <rect width="1200" height="340" rx="10" />
    </clipPath>

    <clipPath id="planet-clip">
      <path d="M -120 340 Q 600 40 1320 340 L 1320 420 L -120 420 Z" />
    </clipPath>
  </defs>

  <g clip-path="url(#banner-clip)">
    <!-- Pure AMOLED Void -->
    <rect width="1200" height="340" fill="url(#bg-void)" />

    <!-- Zenith Corona -->
    <ellipse cx="600" cy="155" rx="560" ry="185" fill="url(#zenith-corona)" />

    <!-- Zenith Sun Rays -->
    <g opacity="0.9">
      <polygon points="600,-60 180,340 265,340" fill="url(#ray-grad)" />
      <polygon points="600,-60 355,340 445,340" fill="url(#ray-grad)" />
      <polygon points="600,-60 535,340 665,340" fill="url(#ray-grad)" />
      <polygon points="600,-60 755,340 845,340" fill="url(#ray-grad)" />
      <polygon points="600,-60 935,340 1020,340" fill="url(#ray-grad)" />
    </g>

    <!-- Outer Dashed Orbital Ring -->
    <path
      d="M -120 316 Q 600 16 1320 316"
      stroke="url(#orbital-ring)"
      stroke-width="1"
      stroke-dasharray="3 9"
    />

    <!-- Under-the-Curve Planetary Surface & Geodesic Node Network -->
    <g clip-path="url(#planet-clip)">
      <path d="M -120 340 Q 600 40 1320 340 L 1320 420 L -120 420 Z" fill="url(#planet-crust)" />

      <!-- Foreshortened Spherical Latitude Contours -->
      <path d="M -100 356 Q 600 66 1300 356" stroke="url(#lat-line-1)" stroke-width="0.9" />
      <path d="M -80 378 Q 600 98 1280 378" stroke="url(#lat-line-2)" stroke-width="0.75" />
      <path d="M -60 408 Q 600 138 1260 408" stroke="url(#lat-line-1)" stroke-width="0.75" />
      <path d="M -40 448 Q 600 188 1240 448" stroke="url(#lat-line-2)" stroke-width="0.65" />

      <!-- Curved Spherical Meridian Ribs -->
      <g stroke="#ffffff" stroke-opacity="0.035" stroke-width="0.7">
        <path d="M 600 190 L 600 340" />
        <path d="M 490 198 Q 470 265 445 340" />
        <path d="M 710 198 Q 730 265 755 340" />
        <path d="M 380 218 Q 345 280 305 340" />
        <path d="M 820 218 Q 855 280 895 340" />
        <path d="M 270 250 Q 225 295 175 340" />
        <path d="M 930 250 Q 975 295 1025 340" />
      </g>

      <!-- Geodesic Node Links Under the Curve -->
      <g stroke="#ffffff" stroke-opacity="0.075" stroke-width="0.8">
        <line x1="345" y1="262" x2="430" y2="236" />
        <line x1="430" y1="236" x2="475" y2="278" />
        <line x1="430" y1="236" x2="535" y2="218" />
        <line x1="535" y1="218" x2="600" y2="252" />
        <line x1="535" y1="218" x2="665" y2="218" />
        <line x1="665" y1="218" x2="600" y2="252" />
        <line x1="665" y1="218" x2="770" y2="236" />
        <line x1="770" y1="236" x2="725" y2="278" />
        <line x1="770" y1="236" x2="855" y2="262" />
        <line x1="475" y1="278" x2="600" y2="252" />
        <line x1="600" y1="252" x2="725" y2="278" />
        <line x1="260" y1="296" x2="345" y2="262" />
        <line x1="855" y1="262" x2="940" y2="296" />
      </g>

      <!-- Planetary Surface Relay Nodes -->
      <g fill="#ffffff">
        <circle cx="260" cy="296" r="1.5" fill-opacity="0.28" />
        <circle cx="345" cy="262" r="1.8" fill-opacity="0.42" />
        <circle cx="430" cy="236" r="2.1" fill-opacity="0.58" />
        <circle cx="475" cy="278" r="1.6" fill-opacity="0.35" />
        <circle cx="535" cy="218" r="2.2" fill-opacity="0.65" />
        <circle cx="600" cy="252" r="2.0" fill-opacity="0.52" />
        <circle cx="665" cy="218" r="2.2" fill-opacity="0.65" />
        <circle cx="725" cy="278" r="1.6" fill-opacity="0.35" />
        <circle cx="770" cy="236" r="2.1" fill-opacity="0.58" />
        <circle cx="855" cy="262" r="1.8" fill-opacity="0.42" />
        <circle cx="940" cy="296" r="1.5" fill-opacity="0.28" />
      </g>

      <!-- Target Halo Rings on Key Hub Nodes -->
      <g stroke="#ffffff" stroke-opacity="0.2" stroke-width="0.8" fill="none">
        <circle cx="430" cy="236" r="6" />
        <circle cx="535" cy="218" r="6.5" />
        <circle cx="665" cy="218" r="6.5" />
        <circle cx="770" cy="236" r="6" />
      </g>
    </g>

    <!-- Primary Eclipse Horizon Rim & Bloom -->
    <path d="M -120 340 Q 600 40 1320 340" stroke="url(#eclipse-bloom)" stroke-width="6" />
    <path d="M -120 340 Q 600 40 1320 340" stroke="url(#eclipse-rim)" stroke-width="1.5" />

    <!-- Typography & Brand Lockup -->
    <g text-anchor="middle">
      <text
        x="600"
        y="108"
        fill="#ffffff"
        font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="34"
        font-weight="800"
        letter-spacing="-0.03em"
      >
        NATRIUM TECHNOLOGIES
      </text>

      <text
        x="600"
        y="140"
        fill="#a1a1aa"
        font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Monaco, Consolas, monospace"
        font-size="12"
        font-weight="500"
        letter-spacing="0.16em"
      >
        ZERO-SURVEILLANCE CRYPTOGRAPHIC INFRASTRUCTURE
      </text>
    </g>

    <!-- Outer Frame Border -->
    <rect x="0.5" y="0.5" width="1199" height="339" rx="9.5" stroke="#1e1e24" stroke-width="1" />
  </g>
</svg>
