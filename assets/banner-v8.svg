    </g>

    <!-- Institutional Brand & Subtitle Typography -->
    <g text-anchor="middle">
      <text x="600" y="158" fill="#f4f4f5" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" letter-spacing="0.28em">NATRIUM TECHNOLOGIES INC.</text>
      <text x="600" y="175" fill="#a1a1aa" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="8.5" font-weight="500" letter-spacing="0.20em">SOVEREIGN CRYPTOGRAPHIC INFRASTRUCTURE</text>
    </g>

    <!-- Technical Corner Crosshairs & Operational Telemetry -->
    <g stroke="#ffffff" stroke-opacity="0.30" stroke-width="1">
      <!-- Top Left -->
      <line x1="32" y1="24" x2="32" y2="36" />
      <line x1="26" y1="30" x2="38" y2="30" />
      <!-- Top Right -->
      <line x1="1168" y1="24" x2="1168" y2="36" />
      <line x1="1162" y1="30" x2="1174" y2="30" />
      <!-- Bottom Left -->
      <line x1="32" y1="324" x2="32" y2="336" />
      <line x1="26" y1="330" x2="38" y2="330" />
      <!-- Bottom Right -->
      <line x1="1168" y1="324" x2="1168" y2="336" />
      <line x1="1162" y1="330" x2="1174" y2="330" />
    </g>

    <!-- Subtle Technical Metadata Badges in Top Header -->
    <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="8" fill="#71717a" letter-spacing="0.14em">
      <text x="50" y="33">SYS.ID: NAT-SEC-2026 // ZERO-KNOWLEDGE</text>
      <text x="1150" y="33" text-anchor="end">DIRECT-MX // FIDO2 // AES-256-GCM</text>
    </g>

    <!-- Outer Frame Perimeter Border -->
    <rect x="0.5" y="0.5" width="1199" height="359" rx="9.5" stroke="#18181c" stroke-width="1" />
  </g>
</svg>