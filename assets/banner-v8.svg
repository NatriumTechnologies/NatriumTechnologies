<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%" fill="none">
  <defs>
    <!-- Deep AMOLED Void -->
    <linearGradient id="bg-void" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#010103" />
      <stop offset="50%" stop-color="#000000" />
      <stop offset="100%" stop-color="#030306" />
    </linearGradient>

    <!-- Zenith Volumetric Corona Bloom -->
    <radialGradient id="zenith-corona" cx="50%" cy="32%" r="48%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14" />
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.045" />
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.01" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <!-- Celestial Volumetric Sun Rays -->
    <linearGradient id="ray-grad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.055" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.015" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Planetary Eclipse Rim (Pure Crisp White) -->
    <linearGradient id="eclipse-rim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="20%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.65" />
      <stop offset="80%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Planetary Eclipse Ethereal Bloom -->
    <linearGradient id="eclipse-bloom" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.04" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="75%" stop-color="#ffffff" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Outer Dashed Orbital Ring -->
    <linearGradient id="orbital-ring" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Planetary Surface Crust -->
    <linearGradient id="planet-crust" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#0b0b10" stop-opacity="0.98" />
      <stop offset="40%" stop-color="#030305" stop-opacity="0.99" />
      <stop offset="100%" stop-color="#000000" stop-opacity="1" />
    </linearGradient>

    <!-- Foreshortened Spherical Latitude Contours -->
    <linearGradient id="lat-line-1" x1="10%" y1="0%" x2="90%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="lat-line-2" x1="15%" y1="0%" x2="85%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <clipPath id="banner-clip">
      <rect width="1200" height="360" rx="10" />
    </clipPath>

    <clipPath id="planet-clip">
      <path d="M -120 380 Q 600 196 1320 380 L 1320 440 L -120 440 Z" />
    </clipPath>
  </defs>

  <g clip-path="url(#banner-clip)">
    <!-- Base Void -->
    <rect width="1200" height="360" fill="url(#bg-void)" />

    <!-- Zenith Radial Corona Behind Logo -->
    <ellipse cx="600" cy="115" rx="540" ry="145" fill="url(#zenith-corona)" />

    <!-- Volumetric Sun Rays Emanating Downward -->
    <g opacity="0.95">
      <polygon points="600,-50 160,360 250,360" fill="url(#ray-grad)" />
      <polygon points="600,-50 340,360 430,360" fill="url(#ray-grad)" />
      <polygon points="600,-50 520,360 680,360" fill="url(#ray-grad)" />
      <polygon points="600,-50 770,360 860,360" fill="url(#ray-grad)" />
      <polygon points="600,-50 950,360 1040,360" fill="url(#ray-grad)" />
    </g>

    <!-- Outer Dashed Orbital Ring -->
    <path
      d="M -120 360 Q 600 176 1320 360"
      stroke="url(#orbital-ring)"
      stroke-width="1"
      stroke-dasharray="3 9"
    />

    <!-- Planetary Body Under Horizon -->
    <g clip-path="url(#planet-clip)">
      <path d="M -120 380 Q 600 196 1320 380 L 1320 440 L -120 440 Z" fill="url(#planet-crust)" />

      <!-- Spherical Latitude Contours -->
      <path d="M -100 395 Q 600 220 1300 395" stroke="url(#lat-line-1)" stroke-width="0.85" />
      <path d="M -80 415 Q 600 250 1280 415" stroke="url(#lat-line-2)" stroke-width="0.75" />
      <path d="M -60 440 Q 600 285 1260 440" stroke="url(#lat-line-1)" stroke-width="0.70" />

      <!-- Spherical Meridian Ribs -->
      <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="0.75">
        <path d="M 600 196 L 600 360" />
        <path d="M 510 205 Q 480 270 440 360" />
        <path d="M 690 205 Q 720 270 760 360" />
        <path d="M 410 225 Q 365 290 310 360" />
        <path d="M 790 225 Q 835 290 890 360" />
        <path d="M 290 255 Q 235 305 170 360" />
        <path d="M 910 255 Q 965 305 1030 360" />
      </g>

      <!-- Geodesic Network Links -->
      <g stroke="#ffffff" stroke-opacity="0.09" stroke-width="0.8">
        <line x1="345" y1="292" x2="425" y2="268" />
        <line x1="425" y1="268" x2="480" y2="310" />
        <line x1="425" y1="268" x2="540" y2="252" />
        <line x1="540" y1="252" x2="600" y2="285" />
        <line x1="540" y1="252" x2="660" y2="252" />
        <line x1="660" y1="252" x2="600" y2="285" />
        <line x1="660" y1="252" x2="775" y2="268" />
        <line x1="775" y1="268" x2="720" y2="310" />
        <line x1="775" y1="268" x2="855" y2="292" />
        <line x1="480" y1="310" x2="600" y2="285" />
        <line x1="600" y1="285" x2="720" y2="310" />
        <line x1="260" y1="320" x2="345" y2="292" />
        <line x1="855" y1="292" x2="940" y2="320" />
      </g>

      <!-- Relay Nodes -->
      <g fill="#ffffff">
        <circle cx="260" cy="320" r="1.5" fill-opacity="0.30" />
        <circle cx="345" cy="292" r="1.8" fill-opacity="0.45" />
        <circle cx="425" cy="268" r="2.2" fill-opacity="0.65" />
        <circle cx="480" cy="310" r="1.6" fill-opacity="0.38" />
        <circle cx="540" cy="252" r="2.3" fill-opacity="0.75" />
        <circle cx="600" cy="285" r="2.0" fill-opacity="0.55" />
        <circle cx="660" cy="252" r="2.3" fill-opacity="0.75" />
        <circle cx="720" cy="310" r="1.6" fill-opacity="0.38" />
        <circle cx="775" cy="268" r="2.2" fill-opacity="0.65" />
        <circle cx="855" cy="292" r="1.8" fill-opacity="0.45" />
        <circle cx="940" cy="320" r="1.5" fill-opacity="0.30" />
      </g>

      <!-- Target Reticle Rings on Primary Hubs -->
      <g stroke="#ffffff" stroke-opacity="0.22" stroke-width="0.8" fill="none">
        <circle cx="425" cy="268" r="6" />
        <circle cx="540" cy="252" r="6.5" />
        <circle cx="660" cy="252" r="6.5" />
        <circle cx="775" cy="268" r="6" />
      </g>
    </g>

    <!-- Horizon Rim & Ethereal Bloom -->
    <path d="M -120 380 Q 600 196 1320 380" stroke="url(#eclipse-bloom)" stroke-width="5" />
    <path d="M -120 380 Q 600 196 1320 380" stroke="url(#eclipse-rim)" stroke-width="1.5" />

