<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020203" />
      <stop offset="50%" stop-color="#000000" />
      <stop offset="100%" stop-color="#040406" />
    </linearGradient>

    <radialGradient id="center-glow" cx="50%" cy="42%" r="48%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="grid-fade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.01" />
      <stop offset="15%" stop-color="#ffffff" stop-opacity="0.035" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.06" />
      <stop offset="85%" stop-color="#ffffff" stop-opacity="0.035" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.01" />
    </linearGradient>

    <linearGradient id="horizon-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <clipPath id="banner-clip">
      <rect width="1200" height="320" rx="8" />
    </clipPath>
  </defs>

  <g clip-path="url(#banner-clip)">
    <!-- Base Void -->
    <rect width="1200" height="320" fill="url(#bg-grad)" />

    <!-- Ambient Radial Glow -->
    <ellipse cx="600" cy="130" rx="520" ry="160" fill="url(#center-glow)" />

    <!-- Precision Architectural Grid -->
    <g stroke="url(#grid-fade)" stroke-width="0.75" stroke-dasharray="2 6">
      <!-- Vertical Grid Lines -->
      <line x1="200" y1="0" x2="200" y2="320" />
      <line x1="360" y1="0" x2="360" y2="320" />
      <line x1="520" y1="0" x2="520" y2="320" />
      <line x1="680" y1="0" x2="680" y2="320" />
      <line x1="840" y1="0" x2="840" y2="320" />
      <line x1="1000" y1="0" x2="1000" y2="320" />

      <!-- Horizontal Grid Lines -->
      <line x1="0" y1="80" x2="1200" y2="80" />
      <line x1="0" y1="160" x2="1200" y2="160" />
      <line x1="0" y1="240" x2="1200" y2="240" />
    </g>

    <!-- Center Technical Horizon Axis -->
    <line x1="300" y1="210" x2="900" y2="210" stroke="url(#horizon-line)" stroke-width="1" />

    <!-- Corner Engineering Crosshairs -->
    <g stroke="#ffffff" stroke-opacity="0.25" stroke-width="1">
      <!-- Top Left -->
      <line x1="32" y1="26" x2="32" y2="38" />
      <line x1="26" y1="32" x2="38" y2="32" />
      <!-- Top Right -->
      <line x1="1168" y1="26" x2="1168" y2="38" />
      <line x1="1162" y1="32" x2="1174" y2="32" />
      <!-- Bottom Left -->
      <line x1="32" y1="282" x2="32" y2="294" />
      <line x1="26" y1="288" x2="38" y2="288" />
      <!-- Bottom Right -->
      <line x1="1168" y1="282" x2="1168" y2="294" />
      <line x1="1162" y1="288" x2="1174" y2="288" />
    </g>

