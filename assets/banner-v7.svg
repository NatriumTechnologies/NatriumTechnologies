      <text x="600" y="244" fill="#f4f4f5" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" letter-spacing="0.28em">NATRIUM TECHNOLOGIES INC.</text>
